<footer class="site-footer">
  <div class="container footer-grid">
    <div><img src="/assets/images/logo-plano-333-amarelo.png" width="202" height="89" alt="Plano 3-3-3" loading="lazy"></div>
    <div>
      <h2>{{ site.title }}</h2>
      <p>{{ site.description }}</p>
    </div>
    {%- for col in site.data.site.footer %}
    <div>
      <h2>{{ col.title }}</h2>
      <ul>
        {%- for l in col.links %}
        <li><a href="{{ l.url }}">{{ l.title }}</a></li>
        {%- endfor %}
      </ul>
    </div>
    {%- endfor %}
  </div>
  <div class="footer-bottom">
    <div class="container">
      <p>Copyright © 2025 {{ site.title }}</p>
      {% include social.html %}
    </div>
  </div>
</footer>
