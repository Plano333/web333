{%- comment -%}
YouTube video. id. Shows the thumbnail; the player (and any YouTube request) loads only on click.
Wrapped in a div so Markdown doesn't put the button inside a paragraph.
{%- endcomment -%}
<div class="video-wrap"><button type="button" class="video" data-yt="{{ include.id }}" aria-label="Reproduzir vídeo" style="--thumb: url(/assets/images/youtube/{{ include.id }}.jpg)"></button></div>
