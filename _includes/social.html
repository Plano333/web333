{%- comment -%}Social links from _data/site.yml. class, style: plain (default) | badge.{%- endcomment -%}
<ul class="social {{ include.class }}{% if include.style == 'badge' %} social-badge{% endif %}">
  {%- for s in site.data.site.social %}
  <li><a href="{{ s.url }}" target="_blank" rel="noopener" aria-label="{{ s.name }}">{% include icon.html name=s.icon %}</a></li>
  {%- endfor %}
</ul>
