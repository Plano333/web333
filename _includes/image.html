{%- comment -%}Image. src, alt, url (optional link), class.{%- endcomment -%}
{%- capture img %}<img src="{{ include.src }}" alt="{{ include.alt }}" loading="lazy">{% endcapture -%}
<figure class="img {{ include.class }}">{% if include.url %}<a href="{{ include.url }}">{{ img }}</a>{% else %}{{ img }}{% endif %}</figure>
