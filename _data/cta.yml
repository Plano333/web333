treino:
  theme: navy
  image: /assets/images/radio-cb-2.webp
  kicker: Saiba comunicar em qualquer emergência
  title: Participe no Treino do Plano 3-3-3
  text: |
    Treinar é essencial para garantir que você e sua comunidade estão prontos para agir em situações críticas. O treino semanal do Plano 3-3-3 ajuda a melhorar suas habilidades de comunicação via rádio e a criar uma rede sólida de contactos na sua região.

    **Junte-se a nós todos os sábados às 21:00** e fortaleça sua capacidade de ajudar e ser ajudado!
  button: { text: Veja como participar, url: /treino-semanal/ }

