# Promo cards shown in pairs at the bottom of pages (front matter `cta: [key, key]`).
# theme: yellow (navy button) or navy (yellow button); image is the card background.
# Several pages use slightly different wording, so each wording has its own key.

plano:
  theme: yellow
  image: /assets/images/radios.webp
  kicker: Rede de comunicações para emergências
  title: Conheça o Plano 3-3-3
  text: |
    O Plano 3-3-3 é a solução simples e eficaz para se manter conectado em situações de emergência. Saiba como funciona, como participar e por que é uma ferramenta essencial para a sua segurança e a da sua comunidade.

    **Descubra tudo sobre o Plano 3-3-3 e como pode começar hoje!**
  button: { text: Saiba mais, url: /plano-3-3-3/ }

