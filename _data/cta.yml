# Promo cards shown in pairs at the bottom of pages (front matter `cta: [key, key]`).
# theme: yellow (navy button) or navy (yellow button); image is the card background.

plano:
  theme: yellow
  image: /assets/images/radios.webp
  kicker: Rede de comunicações alternativas
  title: Conheça o Plano 3-3-3
  text: |
    O Plano 3-3-3 é uma forma simples de se manter em contacto numa emergência, por rádio ou pelas redes mesh. Saiba como funciona e como pode participar, com a sua família e a sua comunidade.

    **Comece hoje.**
  button: { text: Saiba mais, url: /plano-3-3-3/ }

treino:
  theme: navy
  image: /assets/images/radio-cb-2.webp
  kicker: Saiba comunicar em qualquer emergência
  title: Participe no Treino do Plano 3-3-3
  text: |
    Numa emergência, só funciona o que foi treinado. O treino semanal ajuda-o a melhorar as suas comunicações por rádio e a conhecer as estações que consegue contactar na sua região.

    **Todos os sábados às 21:00**, no CB, no PMR 446, no Meshtastic e no MeshCore.
  button: { text: Veja como participar, url: /treino-semanal/ }

dicas:
  theme: yellow
  image: /assets/images/radios.webp
  title: Melhore as suas comunicações com as nossas dicas
  small_title: true
  text: |
    Onde se colocar, como aumentar o alcance do rádio e que erros evitar. Dicas práticas para usar o seu rádio portátil.

    **Veja como melhorar as suas comunicações no Plano 3-3-3.**
  button: { text: Veja as nossas dicas, url: /dicas-para-usar-um-radio-portatil/ }
